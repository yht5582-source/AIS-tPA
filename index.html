<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS 雙軌決策支援系統 (tPA + EVT)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h2 { color: #2980b9; margin-top: 25px; border-left: 4px solid #3498db; padding-left: 10px; font-size: 1.2em; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="datetime-local"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .checkbox-group label { font-weight: normal; display: flex; align-items: center; cursor: pointer; padding: 8px; background: #f9f9f9; border-radius: 5px; margin-bottom: 5px; transition: 0.2s; }
        .checkbox-group label:hover { background: #eef2f5; }
        .checkbox-group input { margin-right: 10px; width: 18px; height: 18px; }
        .btn { display: block; width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 1.1em; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #2980b9; }
        #result-box { margin-top: 30px; padding: 20px; border-radius: 8px; display: none; }
        .scenario-a { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .scenario-b { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
        .scenario-c { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .scenario-d { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .dose-calculator { margin-top: 15px; background: rgba(255,255,255,0.8); padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>急性缺血性腦中風 (AIS) 決策系統</h1>

    <!-- 階段一：時間評估 -->
    <h2>1. 黃金時窗評估</h2>
    <div class="form-group">
        <label>最後正常時間 (Last Known Well):</label>
        <input type="datetime-local" id="timeLkw" required>
    </div>
    <div class="form-group">
        <label>目前評估時間:</label>
        <input type="datetime-local" id="timeNow" required>
    </div>

    <!-- 階段二：臨床與影像篩檢 -->
    <h2>2. 臨床與影像篩檢</h2>
    <div class="form-group">
        <label>NIHSS 神經學評分 (0-42):</label>
        <input type="number" id="nihss" min="0" max="42" value="10">
    </div>
    <div class="form-group">
        <label>病患體重 (kg) - 用於計算劑量:</label>
        <input type="number" id="weight" min="30" max="150" value="60">
    </div>
    <div class="checkbox-group">
        <label><input type="checkbox" id="hasLvo"> CTA/MRA 證實有大血管阻塞 (ICA 或 MCA M1/M2)</label>
        <label><input type="checkbox" id="aspectsLow"> CT ASPECTS 分數 < 6 分 (大範圍梗塞)</label>
    </div>

    <!-- 階段三：禁忌症檢核 -->
    <h2>3. 絕對禁忌症檢核 (若有請勾選)</h2>
    <div class="checkbox-group">
        <label><input type="checkbox" class="tpa-contra"> [tPA] 腦部影像顯示顱內出血 (ICH)</label>
        <label><input type="checkbox" class="tpa-contra"> [tPA] 近期有嚴重創傷、大手術或腸胃道出血</label>
        <label><input type="checkbox" class="tpa-contra"> [tPA] 收縮壓 > 185 或 舒張壓 > 110 (且藥物無法控制)</label>
        <label><input type="checkbox" class="tpa-contra"> [tPA] 正在使用 DOACs 或 Warfarin (INR > 1.7)</label>
        <label><input type="checkbox" class="evt-contra"> [EVT] 發病前 mRS 失能分數 ≥ 3 分或預期壽命極短</label>
    </div>

    <button class="btn" onclick="calculateDecision()">產出處置決策</button>

    <!-- 階段四：決策輸出 -->
    <div id="result-box">
        <h3 id="result-title"></h3>
        <p id="result-desc"></p>
        <div id="dose-box" class="dose-calculator" style="display:none;"></div>
    </div>
</div>

<script>
    // 設定預設時間為現在與三小時前，方便測試
    window.onload = function() {
        let now = new Date();
        let lkw = new Date(now.getTime() - 3 * 60 * 60 * 1000);
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        lkw.setMinutes(lkw.getMinutes() - lkw.getTimezoneOffset());
        document.getElementById('timeNow').value = now.toISOString().slice(0,16);
        document.getElementById('timeLkw').value = lkw.toISOString().slice(0,16);
    };

    function calculateDecision() {
        const t1 = new Date(document.getElementById('timeLkw').value);
        const t2 = new Date(document.getElementById('timeNow').value);
        const diffHours = (t2 - t1) / (1000 * 60 * 60);
        
        const hasLvo = document.getElementById('hasLvo').checked;
        const aspectsLow = document.getElementById('aspectsLow').checked;
        const weight = Math.min(parseFloat(document.getElementById('weight').value) || 60, 100); // 體重上限100kg

        // 檢查禁忌症
        let tpaContra = false;
        document.querySelectorAll('.tpa-contra').forEach(cb => { if(cb.checked) tpaContra = true; });
        
        let evtContra = false;
        document.querySelectorAll('.evt-contra').forEach(cb => { if(cb.checked) evtContra = true; });

        // 判定資格
        let eligibleTpa = (diffHours <= 4.5) && !tpaContra;
        let eligibleEvt = (diffHours <= 24) && hasLvo && !aspectsLow && !evtContra;

        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const doseBox = document.getElementById('dose-box');
        
        resultBox.style.display = 'block';
        doseBox.style.display = 'none';
        resultBox.className = '';

        // 劑量計算邏輯
        const totalDose = (weight * 0.9).toFixed(1);
        const bolus = (totalDose * 0.1).toFixed(1);
        const infusion = (totalDose * 0.9).toFixed(1);
        const waste = (50 - totalDose > 0) ? (50 - totalDose).toFixed(1) : (100 - totalDose).toFixed(1); // 假設使用50mg藥瓶

        const doseHtml = `
            <strong>💊 tPA 劑量精算 (0.9 mg/kg, Max 90mg)：</strong><br>
            • 總劑量：<b>${totalDose} mg</b><br>
            • 靜脈推注 (Bolus, 1分鐘)：<b>${bolus} mg</b><br>
            • 靜脈點滴 (Infusion, 1小時)：<b>${infusion} mg</b><br>
            <span style="color:#d35400;">⚠️ 防呆提醒：請先從藥瓶中抽除並丟棄 <b>${waste} mg</b>，避免過量施打。</span>
        `;

        // 決策矩陣分流
        if (eligibleTpa && eligibleEvt) {
            resultBox.classList.add('scenario-a');
            resultTitle.innerHTML = "情境 A：Bridging Therapy (雙軌啟動)";
            resultDesc.innerHTML = `時間窗為 ${diffHours.toFixed(1)} 小時。<b>處置：立即施打 IV tPA，並同步呼叫神經介入小組進行 EVT。</b>請勿等待 tPA 滴注完畢才送導管室！`;
            doseBox.innerHTML = doseHtml;
            doseBox.style.display = 'block';
        } 
        else if (eligibleTpa && !eligibleEvt) {
            resultBox.classList.add('scenario-b');
            resultTitle.innerHTML = "情境 B：IV tPA Only";
            let evtReason = (!hasLvo) ? "無大血管阻塞" : (aspectsLow ? "ASPECTS分數過低" : (evtContra ? "有EVT禁忌症" : "超過24小時"));
            resultDesc.innerHTML = `時間窗為 ${diffHours.toFixed(1)} 小時。因 ${evtReason}，不適用或不需動脈取栓。<b>處置：給予標準 IV tPA 治療。</b>`;
            doseBox.innerHTML = doseHtml;
            doseBox.style.display = 'block';
        } 
        else if (!eligibleTpa && eligibleEvt) {
            resultBox.classList.add('scenario-c');
            resultTitle.innerHTML = "情境 C：EVT Only (直接動脈取栓)";
            let tpaReason = (diffHours > 4.5) ? "超過4.5小時時窗" : "有tPA絕對禁忌症";
            resultDesc.innerHTML = `因 ${tpaReason}，不適用靜脈血栓溶解劑。<b>處置：直接安排 EVT 動脈取栓。請準備同意書並確認患者腎功能與備血狀態。</b>`;
        } 
        else {
            resultBox.classList.add('scenario-d');
            resultTitle.innerHTML = "情境 D：皆不符合急症再灌注標準";
            resultDesc.innerHTML = `時間窗為 ${diffHours.toFixed(1)} 小時。患者有禁忌症、無血管阻塞或已大範圍梗塞。<b>處置：進入次級預防，給予抗血小板藥物（如 DAPT）、Statin 控制，並安排病房觀察。</b>`;
        }
    }
</script>

</body>
</html>
